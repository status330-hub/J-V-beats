<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BEATS J.V.</title>
<style>
:root{--bg:#050510;--pink:#ff00aa;--blue:#00d9ff}
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}
body{background:radial-gradient(circle at top,#180030,#050510);color:#fff;padding:20px}
.logo{text-align:center;font-size:64px;font-weight:900;text-shadow:0 0 10px var(--pink),0 0 30px var(--blue);margin-bottom:10px}
.subtitle{text-align:center;color:#ddd;margin-bottom:15px}
.equalizer{display:flex;justify-content:center;align-items:flex-end;gap:6px;height:80px;margin-bottom:25px}
.equalizer span{width:8px;border-radius:20px;background:linear-gradient(to top,var(--pink),var(--blue));animation:eq 1.2s infinite ease-in-out}
.equalizer span:nth-child(2){animation-delay:.1s}.equalizer span:nth-child(3){animation-delay:.2s}.equalizer span:nth-child(4){animation-delay:.3s}.equalizer span:nth-child(5){animation-delay:.4s}.equalizer span:nth-child(6){animation-delay:.5s}
.search{max-width:1200px;margin:auto;display:flex;gap:10px}
.search input,#localSearch{flex:1;padding:14px;border:none;border-radius:12px;background:#11152d;color:#fff}
button{border:none;border-radius:12px;padding:14px 18px;cursor:pointer}
.btn{background:linear-gradient(45deg,var(--pink),var(--blue));color:#fff}
.section{max-width:1200px;margin:20px auto;font-size:24px}
.grid{max-width:1200px;margin:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;overflow:hidden}
.card img{width:100%;height:260px;object-fit:cover}
.content{padding:12px}
.actions{display:flex;gap:8px;margin-top:10px}
.listen{background:#00d9ff}.save{background:#ff00aa;color:#fff}.delete{background:#ff4444;color:#fff}
@keyframes eq{0%{height:10px}50%{height:80px}100%{height:20px}}
</style>
</head>
<body>
<h1 class="logo">BEATS J.V.</h1>
<div class="subtitle">Fresh Releases • Last 60 Days</div>
<div class="equalizer"><span></span><span></span><span></span><span></span><span></span><span></span></div>

<div class="search">
<input id="query" placeholder="Исполнитель, трек или жанр">
<button class="btn" onclick="searchMusic()">Поиск</button>
</div>

<div class="section">❤️ Избранное поиск</div>
<div style="max-width:1200px;margin:auto"><input id="localSearch" placeholder="Поиск по избранному" onkeyup="renderSaved()"></div>

<div class="section">🔥 Найденные треки</div>
<div id="results" class="grid"></div>

<div class="section">❤️ Избранное</div>
<div id="saved" class="grid"></div>

<script>
let favorites=JSON.parse(localStorage.getItem('beatsJV')||'[]');
let current=[];

async function searchMusic(){
 const q=document.getElementById('query').value.trim();
 if(!q) return;
 const box=document.getElementById('results');
 box.innerHTML='Поиск...';
 try{
   const r=await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&entity=song&limit=50`);
   const data=await r.json();
   const d=new Date(); d.setMonth(d.getMonth()-2);
   current=data.results.filter(x=>new Date(x.releaseDate)>=d);
   if(!current.length){box.innerHTML='Нет релизов за последние 60 дней';return;}
   box.innerHTML=current.map(t=>card(t,false)).join('');
 }catch(e){box.innerHTML='Ошибка';}
}

function card(t,saved){
 return `<div class="card">
 <img src="${t.artworkUrl100.replace('100x100','600x600')}">
 <div class="content">
 <h3>${t.trackName}</h3>
 <p>👤 ${t.artistName}</p>
 <p>💿 ${t.collectionName||''}</p>
 <p>📅 ${new Date(t.releaseDate).toLocaleDateString('ru-RU')}</p>
 <div class="actions">
 <button class="listen" onclick="window.open('${t.trackViewUrl}','_blank')">▶</button>
 ${saved?`<button class="delete" onclick="delFav(${t.trackId})">🗑</button>`:`<button class="save" onclick="addFav(${t.trackId})">❤️</button>`}
 </div></div></div>`;
}

function addFav(id){
 const t=current.find(x=>x.trackId===id);
 if(!t) return;
 if(favorites.some(x=>x.trackId===id)) return;
 favorites.push(t);
 localStorage.setItem('beatsJV',JSON.stringify(favorites));
 renderSaved();
}

function delFav(id){
 favorites=favorites.filter(x=>x.trackId!==id);
 localStorage.setItem('beatsJV',JSON.stringify(favorites));
 renderSaved();
}

function renderSaved(){
 const q=(document.getElementById('localSearch').value||'').toLowerCase();
 const list=favorites.filter(t=>(t.trackName||'').toLowerCase().includes(q)||(t.artistName||'').toLowerCase().includes(q));
 document.getElementById('saved').innerHTML=list.map(t=>card(t,true)).join('');
}
renderSaved();
</script>
</body>
</html>
