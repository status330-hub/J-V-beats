<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEATS J.V.</title>

<style>
:root{
    --bg:#050510;
    --pink:#ff00aa;
    --blue:#00d9ff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{
    background:radial-gradient(circle at top,#180030,#050510);
    color:white;
    min-height:100vh;
    padding:20px;
}

.logo{
    text-align:center;
    font-size:60px;
    font-weight:900;
    margin-bottom:10px;
    text-shadow:
        0 0 10px var(--pink),
        0 0 30px var(--blue);
}

.subtitle{
    text-align:center;
    margin-bottom:20px;
    color:#ccc;
}

.equalizer{
    display:flex;
    justify-content:center;
    align-items:flex-end;
    gap:6px;
    height:80px;
    margin-bottom:30px;
}

.equalizer span{
    width:8px;
    border-radius:20px;
    background:linear-gradient(to top,var(--pink),var(--blue));
    animation:eq 1.2s infinite ease-in-out;
}

.equalizer span:nth-child(2){animation-delay:.1s;}
.equalizer span:nth-child(3){animation-delay:.2s;}
.equalizer span:nth-child(4){animation-delay:.3s;}
.equalizer span:nth-child(5){animation-delay:.4s;}
.equalizer span:nth-child(6){animation-delay:.5s;}

@keyframes eq{
    0%{height:10px;}
    50%{height:80px;}
    100%{height:20px;}
}

.search{
    max-width:1000px;
    margin:auto;
    display:flex;
    gap:10px;
}

.search input{
    flex:1;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#11152d;
    color:white;
}

.search button{
    border:none;
    border-radius:12px;
    padding:15px 25px;
    cursor:pointer;
    background:linear-gradient(45deg,var(--pink),var(--blue));
    color:white;
    font-weight:bold;
}

.results{
    max-width:1000px;
    margin:30px auto;
    display:grid;
    gap:20px;
}

.card{
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.1);
    border-radius:16px;
    padding:20px;
}

.card a{
    color:#00d9ff;
}
</style>
</head>

<body>

<h1 class="logo">BEATS J.V.</h1>

<div class="subtitle">
Real-Time Music News Search
</div>

<div class="equalizer">
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
</div>

<div class="search">
<input id="query" placeholder="Например: Eminem new album">
<button onclick="searchNews()">ПОИСК</button>
</div>

<div id="results" class="results"></div>

<script>

const TAVILY_API_KEY = "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";

async function searchNews(){

    const query =
        document.getElementById("query")
        .value
        .trim();

    if(!query) return;

    const results =
        document.getElementById("results");

    results.innerHTML = "Поиск...";

    try{

        const response = await fetch(
            "https://api.tavily.com/search",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    api_key:TAVILY_API_KEY,
                    query:query,
                    search_depth:"advanced",
                    max_results:10
                })
            }
        );

        const data =
            await response.json();

        if(!data.results){

            results.innerHTML =
                "Нет результатов";

            return;
        }

        results.innerHTML =
            data.results.map(item => `
                <div class="card">
                    <h3>${item.title || ""}</h3>

                    <p style="margin-top:10px;">
                        ${item.content || ""}
                    </p>

                    <p style="margin-top:15px;">
                        <a href="${item.url}"
                           target="_blank">
                           Открыть источник
                        </a>
                    </p>
                </div>
            `).join("");

    }catch(error){

        console.error(error);

        results.innerHTML =
            "Ошибка. Возможно Tavily блокирует запросы из браузера (CORS).";
    }
}

</script>

</body>
</html>
